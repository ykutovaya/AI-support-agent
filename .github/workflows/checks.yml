name: Проверки

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    name: Windows · Python 3.12
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHON_DOTENV_DISABLED: '1'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Получить код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Установить uv и Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.10.4'
          python-version: '3.12.12'
          enable-cache: false

      - name: Установить закреплённые зависимости
        id: install
        run: uv sync --locked --extra retail --extra dev

      - name: Выполнить тесты без API
        id: pytest
        run: uv run --no-sync python -m pytest --junitxml=var/ci/pytest.xml

      - name: Сохранить отчёт при ошибке тестов
        if: ${{ failure() && steps.pytest.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-report
          path: var/ci/pytest.xml
          if-no-files-found: error

      - name: Проверить код Ruff
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --no-sync ruff check .
